<!DOCTYPE html>
<html>

<head>
  <title>Environment Switcher</title>
  <link href="assets/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/docs.css" rel="stylesheet" />
  <link href="assets/bootstrap.bundle.min.js" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="assets/bootstrap.bundle.min.js"></script>
</head>

<body data-bs-theme="dark">

  <form class="p-3 m-0 border-0 bd-example m-0 border-0" id="env-form">
    <div>
      <h3 class="d-inline-block">Environment</h3>
      <img class="d-inline-block" src="icon.png" width="30px" height="30px" />

    </div>
    <h6 class="text-uppercase text-body-secondary mb-2">Development</h6>
    <div class="row gx-1">
      <div class="col-12">
        <input type="radio" class="btn-check" name="environment" value="feature" id="feature" autocomplete="off" />
        <label class="btn btn-outline-info w-100" for="feature">FEATURE</label>
      </div>
    </div>
    <div class="row gx-1">
      <div class="col-3">
        <input type="radio" class="btn-check" name="environment" value="stage" id="stage" autocomplete="off" />
        <label class="btn btn-outline-orange w-100" for="stage">STAGE</label>
      </div>
      <div class="col-3">
        <input type="radio" class="btn-check" name="environment" value="dev" id="dev" autocomplete="off" />
        <label class="btn btn-outline-purple w-100" for="dev">DEV</label>
      </div>
      <div class="col-3">
        <input type="radio" class="btn-check" name="environment" value="demo" id="demo" autocomplete="off" />
        <label class="btn btn-outline-warning w-100" for="demo">DEMO</label>
      </div>
      <div class="col-3">
        <input type="radio" class="btn-check" name="environment" value="pilot" id="pilot" autocomplete="off" />
        <label class="btn btn-outline-light w-100" for="pilot">PILOT</label>
      </div>
    </div>

    <div class="divider-m"></div>

    <h6 class="text-uppercase text-body-secondary mb-2">Live</h6>
    <div class="row gx-1">
      <div class="col-5">
        <input type="radio" class="btn-check" name="environment" value="prod" id="prod" autocomplete="off" />
        <label class="btn btn-outline-primary w-100" for="prod">PRODUCTION</label>
      </div>
      <div class="col-3">
        <input type="radio" class="btn-check" name="environment" value="prime" id="prime" autocomplete="off" />
        <label class="btn btn-outline-danger w-100" for="prime">PRIME</label>
      </div>
      <div class="col-4">
        <input type="radio" class="btn-check" name="environment" value="curaleaf" id="curaleaf" autocomplete="off" />
        <label class="btn btn-outline-success w-100" for="curaleaf">CURALEAF</label>
      </div>
    </div>
    <div class="divider-m"></div>

    <div id="feature-options" style="display: none">
      <h6 class="mb-2">Project</h6>
      <div class="divider-s"></div>
      <div>
        <input type="radio" class="btn-check" name="project" value="ecom" id="ecom" autocomplete="off" checked="" />
        <label class="btn btn-outline-info" for="ecom">ECOM</label>

        <input type="radio" class="btn-check" name="project" value="ci" id="ci" autocomplete="off" checked="" />
        <label class="btn btn-outline-info" for="ci">CI</label>

        <input type="radio" class="btn-check" name="project" value="sweed" id="sweed" autocomplete="off" checked="" />
        <label class="btn btn-outline-info" for="sweed">SWEED</label>
      </div>

      <div class="divider-s"></div>

      <div class="input-group mb-3">
        <span class="input-group-text" id="feature-id-span">#</span>
        <input id="feature-id" name="id" type="number" class="form-control" placeholder="Feature Number" />
      </div>

      <div class="divider-m"></div>
    </div>


    <h6 class="mb-2">Store #</h6>
    <div class="input-group mb-3">
      <span class="input-group-text" id="store-id-span">#</span>
      <input id="store-id" name="store-id" type="number" class="form-control" placeholder="Store #" />
    </div>

    <div class="d-grid gap-1">
      <button type="button" class="btn btn-theme" id="portal-btn">Portal</button>
      <div class="row gx-2">
        <div class="col-6">
          <button type="button" class="btn btn-theme w-100" id="cashier-btn">Cashier</button>
        </div>
        <div class="col-6">
          <button type="button" class="btn btn-theme w-100" id="shop-btn">Shop</button>
        </div>
      </div>
      <div class="row gx-2">
        <div class="col-6">
          <button type="button" class="btn btn-theme w-100" id="kiosk-btn">Kiosk 2.0</button>
        </div>
        <div class="col-6">
          <button type="button" class="btn btn-theme w-100" id="second-screen-btn">Second Screen</button>
        </div>
      </div>
    </div>
  </form>

  <script src="popup.js"></script>
</body>

</html>
